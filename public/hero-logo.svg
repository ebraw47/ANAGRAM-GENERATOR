<svg xmlns="http://www.w3.org/2000/svg" width="640" height="220" viewBox="0 0 640 220" fill="none">
  <defs>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C9B458"/>
      <stop offset="50%" stop-color="#9FBA5E"/>
      <stop offset="100%" stop-color="#6AAA64"/>
    </linearGradient>
  </defs>
  <!-- W badge: yellow → green mix (no background plate) -->
  <circle cx="96" cy="110" r="70" fill="url(#badge)"/>
  <circle cx="96" cy="110" r="80" fill="none" stroke="url(#badge)" stroke-width="4" opacity="0.9"/>
  <text x="96" y="138" text-anchor="middle" font-family="Arial Black, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="96" font-weight="800" fill="#0B1526">W</text>
  <!-- Wordmark -->
  <text x="200" y="92" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#C9B458">Wordle</text>
  <line x1="392" y1="78" x2="560" y2="78" stroke="#C9B458" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="200" y1="122" x2="292" y2="122" stroke="#6AAA64" stroke-width="3.5" stroke-linecap="round"/>
  <text x="304" y="154" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#6AAA64">Word Finder</text>
</svg>
